[package]
name = "rss-server-side"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
hyper = { workspace = true }
tokio = { workspace = true }
http-body-util = { workspace = true}
hyper-util = { workspace = true }
bytes = { workspace = true }
pretty_env_logger = { workspace = true }
reqwest = { workspace = true }
base64 = { version = "0.22.1", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
http-body = "1.0.1"
httpdate = "1.0.3"
http = { version = "1.3.1", default-features = false }
serde = {workspace = true }

[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Aaron Stave <astave@pdx.edu>", "Elliot Roberts <relliot@pdx.edu>", "Quentin Scheetz <qscheetz@pdx.edu>", "Tuan Vu <tuanvu@pdx.edu>", "Zihui Zeng <zihui@pdx.edu>", "Cristian Hernandez <Cristhe@pdx.edu>", "Kaevin Barta <kbarta@pdx.edu>"]
repository = "https://github.com/a-stave/RSS-Server-Side"
license = "AGPL-3.0-only"

[workspace.dependencies]
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1.12.1"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.12.22", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }